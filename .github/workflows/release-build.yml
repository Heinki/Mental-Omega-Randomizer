name: Build attested Windows release

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'
      - 'V*'

permissions:
  contents: read

jobs:
  build:
    name: Build and attest Archipelago release
    runs-on: windows-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
      artifact-metadata: write
    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.14.6'
          cache: pip
          cache-dependency-path: requirements-build.txt

      - name: Install pinned build dependencies
        run: python -m pip install --disable-pip-version-check -r requirements-build.txt

      - name: Compile source
        run: python -m compileall -q .

      - name: Build complete Archipelago release
        shell: powershell
        run: .\build_archipelago_release.ps1 -OutputDirectory 'release'

      - name: Attest build provenance
        uses: actions/attest@v4
        with:
          subject-path: '${{ github.workspace }}/release/MentalOmegaRandomizer.exe'

      - name: Upload player downloads
        uses: actions/upload-artifact@v7
        with:
          name: MentalOmegaRandomizer-${{ github.sha }}
          path: |
            release/MentalOmegaRandomizer.exe
            release/mental_omega.apworld
          if-no-files-found: error
          retention-days: 90

      - name: Publish player downloads for version tag
        if: startsWith(github.ref, 'refs/tags/v') || startsWith(github.ref, 'refs/tags/V')
        shell: powershell
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $assetNames = @(
            'MentalOmegaRandomizer.exe'
            'mental_omega.apworld'
          )
          $assets = $assetNames | ForEach-Object {
            (Resolve-Path -LiteralPath (Join-Path 'release' $_)).Path
          }
          gh release view $env:GITHUB_REF_NAME 2>$null | Out-Null
          if ($LASTEXITCODE -eq 0) {
            $existingAssets = gh release view $env:GITHUB_REF_NAME `
              --json assets --jq '.assets[].name'
            foreach ($name in $existingAssets) {
              if ($name -notin $assetNames) {
                gh release delete-asset $env:GITHUB_REF_NAME $name --yes
                if ($LASTEXITCODE -ne 0) {
                  throw "Failed to remove old release asset: $name"
                }
              }
            }
            gh release upload $env:GITHUB_REF_NAME $assets --clobber
          } else {
            gh release create $env:GITHUB_REF_NAME $assets `
              --verify-tag `
              --generate-notes `
              --title $env:GITHUB_REF_NAME
          }
